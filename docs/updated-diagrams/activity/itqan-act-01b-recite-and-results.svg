t-size="12" textLength="154.711" font-family="Helvetica">View session results (UC-12)</text><ellipse cx="217.369" cy="1022.969" rx="11" ry="11" fill="none" style="stroke:#000;stroke-width:0.75;"/><ellipse cx="217.369" cy="1022.969" rx="6" ry="6" fill="#FFF" style="stroke:#000;stroke-width:1;"/><line x1="20" y1="16.137" x2="20" y2="1033.969" style="stroke:#000;stroke-width:0.75;"/><rect x="527.796" y="229.965" width="190.068" height="35.094" fill="#FFF" style="stroke:#000;stroke-width:0.75;" rx="5" ry="5"/><text x="537.796" y="252.422" fill="#000" font-size="12" textLength="170.068" font-family="Helvetica">Show next word as hint (UC-28)</text><polygon points="577.795,180.418,667.865,180.418,679.865,192.418,667.865,204.418,577.795,204.418,565.795,192.418,577.795,180.418" fill="#FFF" style="stroke:#000;stroke-width:0.75;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="626.83" y="216.875" fill="#000" font-size="12" textLength="18.674" font-family="Helvetica">yes</text><text x="577.795" y="197.328" fill="#000" font-size="12" textLength="90.07" font-family="Helvetica">Pause detected?</text><text x="679.865" y="189.781" fill="#000" font-size="12" textLength="13.348" font-family="Helvetica">no</text><polygon points="622.83,285.059,634.83,297.059,622.83,309.059,610.83,297.059,622.83,285.059" fill="#FFF" style="stroke:#000;stroke-width:0.75;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M313.725,326.512 L313.725,366.699 A0,0 0 0 0 313.725,366.699 L502.109,366.699 A0,0 0 0 0 502.109,366.699 L502.109,350.605 L522.109,346.605 L502.109,342.605 L502.109,336.512 L492.109,326.512 L313.725,326.512 A0,0 0 0 0 313.725,326.512" style="stroke:#000;stroke-width:0.75;" fill="#FFF"/><path d="M492.109,326.512 L492.109,336.512 L502.109,336.512 L492.109,326.512" style="stroke:#000;stroke-width:0.75;" fill="#FFF"/><text x="319.725" y="343.969" fill="#000" font-size="12" textLength="116.73" font-family="Helvetica">Runs while the reader</text><text x="319.725" y="359.063" fill="#000" font-size="12" textLength="167.385" font-family="Helvetica">recites the next verse (NFR-03)</text><rect x="522.109" y="329.059" width="201.441" height="35.094" fill="#FFF" style="stroke:#000;stroke-width:0.75;" rx="5" ry="5"/><text x="532.109" y="351.516" fill="#000" font-size="12" textLength="181.441" font-family="Helvetica">Detect end of verse and analyse it</text><polygon points="576.14,389.152,669.521,389.152,681.521,401.152,669.521,413.152,576.14,413.152,564.14,401.152,576.14,389.152" fill="#FFF" style="stroke:#000;stroke-width:0.75;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="576.14" y="406.063" fill="#000" font-size="12" textLength="93.381" font-family="Helvetica">Analysis reliable?</text><text x="545.466" y="398.516" fill="#000" font-size="12" textLength="18.674" font-family="Helvetica">yes</text><text x="681.521" y="398.516" fill="#000" font-size="12" textLength="13.348" font-family="Helvetica">no</text><rect x="412.741" y="423.152" width="202.092" height="50.188" fill="#FFF" style="stroke:#000;stroke-width:0.75;" rx="5" ry="5"/><text x="422.741" y="445.609" fill="#000" font-size="12" textLength="179.408" font-family="Helvetica">Detect errors, link each to a word,</text><text x="422.741" y="460.703" fill="#000" font-size="12" textLength="182.092" font-family="Helvetica">highlight them (wording per mode)</text><rect x="634.833" y="423.152" width="194.082" height="50.188" fill="#FFF" style="stroke:#000;stroke-width:0.75;" rx="5" ry="5"/><text x="644.833" y="445.609" fill="#000" font-size="12" textLength="158.625" font-family="Helvetica">Show "could not analyse" and</text><text x="644.833" y="460.703" fill="#000" font-size="12" textLength="174.082" font-family="Helvetica">exclude the verse from the score</text><polygon points="622.83,479.34,634.83,491.34,622.83,503.34,610.83,491.34,622.83,479.34" fill="#FFF" style="stroke:#000;stroke-width:0.75;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="527.134" y="579.074" width="191.393" height="35.09