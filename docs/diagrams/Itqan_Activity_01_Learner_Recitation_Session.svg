<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2420" viewBox="0 0 1700 2420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#222"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#222}
      .title{font-size:28px;font-weight:bold}
      .subtitle{font-size:14px;fill:#444}
      .lane{fill:#fff;stroke:#c7ccd1;stroke-width:1.5}
      .lanehead{fill:#f4f6f8;stroke:#c7ccd1;stroke-width:1.5}
      .lanetext{font-size:17px;font-weight:bold}
      .action{fill:#fbfbfc;stroke:#222;stroke-width:2}
      .system{fill:#fbfbfc;stroke:#222;stroke-width:2}
      .ai{fill:#eef0f3;stroke:#222;stroke-width:2}
      .data{fill:#eef0f3;stroke:#222;stroke-width:2}
      .decision{fill:#fff;stroke:#555;stroke-width:2}
      .event{fill:#222;stroke:#222}
      .end{fill:#fff;stroke:#222;stroke-width:3}
      .label{font-size:15px;text-anchor:middle}
      .small{font-size:12px;fill:#444;text-anchor:middle}
      .flow{fill:none;stroke:#222;stroke-width:1.8;marker-end:url(#arrow)}
      .note{fill:#fff;stroke:#999;stroke-width:1.3}
      .notetext{font-size:12px;fill:#444}
      .phase{fill:#f4f6f8;fill-opacity:.72;stroke:#c7ccd1;stroke-width:1.5;stroke-dasharray:3 3}
      .phasetitle{font-size:14px;font-weight:bold;fill:#444}
      .phaseid{font-size:12px;font-weight:bold;fill:#555}
      .tag{font-size:12px;font-weight:bold;fill:#555}
    </style>
  </defs>

  <text x="850" y="42" text-anchor="middle" class="title">ITQAN — Activity Diagram 01: Learner Recitation Session</text>
  <text x="850" y="66" text-anchor="middle" class="subtitle">Scope: learner journey from Surah selection through results and progress update</text>

  <rect x="40" y="95" width="360" height="2225" class="lane"/>
  <rect x="400" y="95" width="430" height="2225" class="lane"/>
  <rect x="830" y="95" width="460" height="2225" class="lane"/>
  <rect x="1290" y="95" width="370" height="2225" class="lane"/>
  <rect x="40" y="95" width="360" height="52" class="lanehead"/>
  <rect x="400" y="95" width="430" height="52" class="lanehead"/>
  <rect x="830" y="95" width="460" height="52" class="lanehead"/>
  <rect x="1290" y="95" width="370" height="52" class="lanehead"/>
  <text x="220" y="128" class="lanetext" text-anchor="middle">Learner</text>
  <text x="615" y="128" class="lanetext" text-anchor="middle">Itqan App</text>
  <text x="1060" y="128" class="lanetext" text-anchor="middle">Recitation and AI Services</text>
  <text x="1475" y="128" class="lanetext" text-anchor="middle">Data Store</text>

  <rect x="58" y="158" width="1584" height="565" rx="8" class="phase"/><text x="1320" y="185" class="phaseid">PHASE 01</text><text x="1320" y="207" class="phasetitle">Prepare the learner session</text>
  <rect x="58" y="748" width="1584" height="935" rx="8" class="phase"/><text x="1320" y="775" class="phaseid">PHASE 02</text><text x="1320" y="797" class="phasetitle">Capture, analyse, and correct recitation</text>
  <rect x="58" y="1708" width="1584" height="592" rx="8" class="phase"/><text x="1320" y="1735" class="phaseid">PHASE 03</text><text x="1320" y="1757" class="phasetitle">Close the session and preserve learning progress</text>

  <circle cx="220" cy="180" r="13" class="event"/>
  <rect x="115" y="215" width="210" height="52" rx="7" class="action"/><text x="220" y="247" class="label">Open recitation practice</text>
  <path d="M220 193 L220 215" class="flow"/>

  <rect x="510" y="300" width="210" height="58" rx="7" class="system"/><text x="615" y="326" class="label">Display Juz Amma</text><text x="615" y="345" class="small">available Surahs</text>
  <path d="M325 241 L430 241 L430 329 L510 329" class="flow"/>

  <rect x="115" y="392" width="210" height="58" rx="7" class="action"/><text x="220" y="418" class="label">Select Surah</text><text x="220" y="437" class="small">FR-04, FR-05</text>
  <path d="M510 329 L455 329 L455 421 L325 421" class="flow"/>

  <rect x="500" y="483" width="230" height="58" rx="7" class="system"/><text x="615" y="509" class="label">Display Surah verses</text><text x="615" y="528" class="small">FR-06</text>
  <path d="M325 421 L455 421 L455 512 L500 512" class="flow"/>

  <rect x="115" y="574" width="210" height="58" rx="7" class="action"/><text x="220" y="600" class="label">Select AI mode</text><text x="220" y="619" class="small">Al-Mujawwid or Al-Mushajji</text>
  <path d="M500 512 L455 512 L455 603 L325 603" class="flow"/>

  <rect x="500" y="665" width="230" height="58" rx="7" class="system"/><text x="615" y="691" class="label">Configure session</text><text x="615" y="710" class="small">selected Surah and mode</text>
  <path d="M325 603 L455 603 L455 694 L500 694" class="flow"/>

  <rect x="115" y="756" width="210" height="58" rx="7" class="action"/><text x="220" y="788" class="label">Start recitation session</text>
  <path d="M500 694 L455 694 L455 785 L325 785" class="flow"/>

  <rect x="500" y="847" width="230" height="58" rx="7" class="system"/><text x="615" y="873" class="label">Start microphone capture</text><text x="615" y="892" class="small">FR-11, FR-12</text>
  <path d="M325 785 L455 785 L455 876 L500 876" class="flow"/>

  <rect x="930" y="938" width="260" height="58" rx="7" class="ai"/><text x="1060" y="964" class="label">Analyze recitation audio</text><text x="1060" y="983" class="small">FR-13</text>
  <path d="M730 876 L875 876 L875 967 L930 967" class="flow"/>

  <path d="M1060 1030 L1132 1082 L1060 1134 L988 1082 Z" class="decision"/><text x="1060" y="1078" class="label">Relevant error</text><text x="1060" y="1096" class="label">detected?</text>
  <path d="M1060 996 L1060 1030" class="flow"/>

  <rect x="930" y="1180" width="260" height="58" rx="7" class="ai"/><text x="1060" y="1206" class="label">Identify error location</text><text x="1060" y="1225" class="small">FR-14, FR-15</text>
  <path d="M1060 1134 L1060 1180" class="flow"/><text x="1081" y="1160" class="tag">Yes</text>
  <path d="M988 1082 L780 1082 L780 1655 L325 1655" class="flow"/><text x="868" y="1072" class="tag">No</text>

  <rect x="930" y="1284" width="260" height="58" rx="7" class="ai"/><text x="1060" y="1310" class="label">Generate feedback</text><text x="1060" y="1329" class="small">FR-16</text>
  <path d="M1060 1238 L1060 1284" class="flow"/>

  <path d="M1060 1380 L1132 1432 L1060 1484 L988 1432 Z" class="decision"/><text x="1060" y="1428" class="label">Audio assistance</text><text x="1060" y="1446" class="label">appropriate?</text>
  <path d="M1060 1342 L1060 1380" class="flow"/>

  <rect x="500" y="1525" width="230" height="58" rx="7" class="system"/><text x="615" y="1551" class="label">Present feedback</text><text x="615" y="1570" class="small">error and correction</text>
  <path d="M988 1432 L875 1432 L875 1554 L730 1554" class="flow"/><text x="905" y="1422" class="tag">No</text>

  <rect x="930" y="1525" width="260" height="58" rx="7" class="ai"/><text x="1060" y="1551" class="label">Generate audio assistance</text><text x="1060" y="1570" class="small">FR-17, when appropriate</text>
  <path d="M1060 1484 L1060 1525" class="flow"/><text x="1080" y="1508" class="tag">Yes</text>
  <path d="M930 1554 L875 1554 L875 1554 L730 1554" class="flow"/>

  <rect x="115" y="1626" width="210" height="58" rx="7" class="action"/><text x="220" y="1652" class="label">Continue or end session</text><text x="220" y="1671" class="small">FR-18, FR-19</text>
  <path d="M500 1554 L455 1554 L455 1655 L325 1655" class="flow"/>

  <path d="M220 1720 L292 1772 L220 1824 L148 1772 Z" class="decision"/><text x="220" y="1768" class="label">Continue</text><text x="220" y="1786" class="label">reciting?</text>
  <path d="M220 1684 L220 1720" class="flow"/>
  <path d="M292 1772 L360 1772 L360 876 L500 876" class="flow"/><text x="329" y="1757" class="tag">Yes</text>

  <rect x="930" y="1865" width="260" height="58" rx="7" class="ai"/><text x="1060" y="1891" class="label">Generate session result</text><text x="1060" y="1910" class="small">mastery and detected words</text>
  <path d="M220 1824 L220 1894 L930 1894" class="flow"/><text x="241" y="1857" class="tag">No</text>

  <rect x="1350" y="1965" width="250" height="58" rx="7" class="data"/><text x="1475" y="1991" class="label">Save session record</text><text x="1475" y="2010" class="small">surah, errors, result, time</text>
  <path d="M1190 1894 L1250 1894 L1250 1994 L1350 1994" class="flow"/>

  <rect x="1350" y="2065" width="250" height="58" rx="7" class="data"/><text x="1475" y="2091" class="label">Update progress and streak</text><text x="1475" y="2110" class="small">FR-21, FR-22</text>
  <path d="M1475 2023 L1475 2065" class="flow"/>

  <rect x="500" y="2165" width="230" height="58" rx="7" class="system"/><text x="615" y="2191" class="label">Display session results</text><text x="615" y="2210" class="small">FR-20</text>
  <path d="M1350 2094 L1250 2094 L1250 2194 L730 2194" class="flow"/>

  <circle cx="220" cy="2260" r="17" class="end"/><circle cx="220" cy="2260" r="10" class="event"/>
  <path d="M500 2194 L455 2194 L455 2260 L237 2260" class="flow"/>

  <rect x="70" y="2350" width="1560" height="44" rx="5" class="note"/>
  <text x="88" y="2375" class="notetext">Note: Smart Prompting is included as FR-26 (Should Have) and may be triggered during pauses or hesitation. Mastery is displayed according to FR-20 using the approved effective-error formula.</text>
</svg>
